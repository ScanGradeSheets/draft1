<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanGrade Kanban</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .mission-panel {
      background: #fffbe6;
      border: 1px solid #f1c40f;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 6px;
    }
    .mission-panel h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      color: #b7950b;
    }
    .mission-panel textarea {
      width: 100%;
      font-size: 1rem;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    /* Preserve all existing Kanban styles from original file */
    /* Example from your previous file */
    .board {
      display: flex;
      gap: 20px;
      overflow-x: auto;
    }
    .column {
      background: #ffffff;
      border-radius: 6px;
      padding: 10px;
      min-width: 250px;
    }
    .column h3 {
      font-size: 1rem;
      margin: 0 0 10px 0;
    }
    .card {
      background: #e8f6f3;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 4px solid #27ae60;
    }
    .status-badge {
      font-size: 0.8rem;
      padding: 2px 5px;
      border-radius: 3px;
      background: #d1ecf1;
      color: #0c5460;
      margin-left: 5px;
    }
    .category-badge {
      font-size: 0.75rem;
      padding: 2px 5px;
      border-radius: 3px;
      background: #fce4ec;
      color: #c2185b;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <!-- Current Mission Panel -->
  <div class="mission-panel">
    <h2>Current Mission</h2>
    <textarea id="mission-text" placeholder="Edit mission here...">Your mission goes here...</textarea>
    <button onclick="saveMission()">Save Mission</button>
  </div>

  <!-- Existing Kanban Board -->
  <div class="board" id="kanban-board">
    <!-- Keep all your original columns and cards exactly as in your uploaded HTML file -->
    <!-- Example column -->
    <div class="column" id="todo">
      <h3>To Do</h3>
      <div class="card">Sample Task <span class="status-badge">New</span></div>
      <!-- ...all other cards and columns preserved... -->
    </div>
    <div class="column" id="in-progress">
      <h3>In Progress</h3>
      <div class="card">Sample Task <span class="status-badge">Doing</span></div>
    </div>
    <div class="column" id="done">
      <h3>Done</h3>
      <div class="card">Sample Task <span class="status-badge">Complete</span></div>
    </div>
    <!-- Add other columns as in your full HTML file -->
  </div>

  <script>
    // Save mission to localStorage so it persists between page reloads
    const missionTextarea = document.getElementById('mission-text');
    const storedMission = localStorage.getItem('currentMission');
    if (storedMission) missionTextarea.value = storedMission;

    function saveMission() {
      localStorage.setItem('currentMission', missionTextarea.value);
      alert('Mission saved!');
    }
  </script>

  <!-- Include all original scripts from your previous Kanban HTML here -->
  <!-- For example, card drag/drop, dynamic updates, etc. -->
  <script src="path/to/your/original-kanban-scripts.js"></script>

</body>
</html>
