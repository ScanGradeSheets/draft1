<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScanGrade Grade 2 Worksheets</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        margin: 40px auto;
        max-width: 860px;
        padding: 0 20px;
        color: #1d1d1f;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 32px;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 24px;
        color: #5f6368;
        font-size: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
      }
      th, td {
        border-bottom: 1px solid #d8d8dc;
        padding: 14px 10px;
        text-align: left;
      }
      th {
        color: #5f6368;
        font-size: 13px;
        text-transform: uppercase;
      }
      a {
        color: #0057d8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>ScanGrade Grade 2 Worksheets</h1>
    <p>Open a worksheet and scan it with the ScanGrade app.</p>
    <table>
      <thead>
        <tr>
          <th>Worksheet</th>
          <th>Questions</th>
          <th>Digit boxes</th>
          <th>File</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Addition Within 20</td>
          <td>10</td>
          <td>20</td>
          <td><a href="./grade2-addition-within-20-v1.svg">Open worksheet</a></td>
        </tr>
        <tr>
          <td>Subtraction Within 20</td>
          <td>10</td>
          <td>20</td>
          <td><a href="./grade2-subtraction-within-20-v1.svg">Open worksheet</a></td>
        </tr>
        <tr>
          <td>Mixed Within 50</td>
          <td>10</td>
          <td>20</td>
          <td><a href="./grade2-mixed-within-50-v1.svg">Open worksheet</a></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
